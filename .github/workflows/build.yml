name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip project
        run: unzip -o merchant-data-app.zip -d project
      - name: Build debug APK
        working-directory: project/merchant-data-app
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: merchant-data-app-debug-apk
          path: project/merchant-data-app/app/build/outputs/apk/debug/app-debug.apk
